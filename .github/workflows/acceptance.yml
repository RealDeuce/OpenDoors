name: Extended acceptance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        variant: [Shared, Static]

    steps:
      - uses: actions/checkout@v7

      - name: Build and install selected library
        run: |
          shared=OFF
          static=OFF
          if [[ '${{ matrix.variant }}' == Shared ]]; then
            shared=ON
          else
            static=ON
          fi
          cmake \
            -S . \
            -B build/library \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENDOORS_BUILD_SHARED=$shared \
            -DOPENDOORS_BUILD_STATIC=$static \
            -DOPENDOORS_BUILD_EXAMPLES=OFF \
            -DOPENDOORS_WARNINGS_AS_ERRORS=ON
          cmake --build build/library --parallel
          cmake --install build/library --prefix "$RUNNER_TEMP/opendoors"

      - name: Build installed public consumer
        run: |
          cmake \
            -S tests/acceptance \
            -B build/acceptance \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/opendoors" \
            -DOPENDOORS_VARIANT=${{ matrix.variant }} \
            -DOPENDOORS_ACCEPTANCE_EXTENDED=ON
          cmake --build build/acceptance --parallel

      - name: Run extended acceptance suite
        run: >-
          ctest
          --test-dir build/acceptance
          --output-on-failure
          --output-junit acceptance-${{ matrix.os }}-${{ matrix.variant }}.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            build/acceptance/acceptance-*.xml
            build/acceptance/Testing/Temporary/LastTest.log

  windows:
    name: Windows ${{ matrix.variant }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Shared
            shared: ON
            static: OFF
            static_mt: OFF
            runtime: MultiThreadedDLL
          - variant: Static
            shared: OFF
            static: ON
            static_mt: OFF
            runtime: MultiThreadedDLL
          - variant: StaticMT
            shared: OFF
            static: ON
            static_mt: ON
            runtime: MultiThreaded

    steps:
      - uses: actions/checkout@v7

      - name: Build and install selected library
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build/library `
            -A x64 `
            -DOPENDOORS_BUILD_SHARED=${{ matrix.shared }} `
            -DOPENDOORS_BUILD_STATIC=${{ matrix.static }} `
            -DOPENDOORS_BUILD_MSVC_STATIC_MT=${{ matrix.static_mt }} `
            -DOPENDOORS_BUILD_EXAMPLES=OFF `
            -DOPENDOORS_WARNINGS_AS_ERRORS=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          cmake --build build/library --config Release --parallel
          cmake --install build/library --config Release `
            --prefix "$env:RUNNER_TEMP/opendoors"

      - name: Build installed public consumer
        shell: pwsh
        run: |
          cmake `
            -S tests/acceptance `
            -B build/acceptance `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/opendoors" `
            -DOPENDOORS_VARIANT=${{ matrix.variant }} `
            -DOPENDOORS_ACCEPTANCE_EXTENDED=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=${{ matrix.runtime }}
          cmake --build build/acceptance --config Release --parallel

      - name: Run extended acceptance suite
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\opendoors\bin;$env:PATH"
          ctest `
            --test-dir build/acceptance `
            -C Release `
            --output-on-failure `
            --output-junit "acceptance-windows-${{ matrix.variant }}.xml"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-windows-${{ matrix.variant }}
          path: |
            build/acceptance/acceptance-*.xml
            build/acceptance/Testing/Temporary/LastTest.log

  coverage:
    name: Public acceptance branch coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build instrumented shared library
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake \
            -S . \
            -B build/coverage-library \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOPENDOORS_BUILD_SHARED=ON \
            -DOPENDOORS_BUILD_STATIC=OFF \
            -DOPENDOORS_BUILD_EXAMPLES=OFF \
            '-DCMAKE_C_FLAGS=-fprofile-instr-generate -fcoverage-mapping' \
            '-DCMAKE_SHARED_LINKER_FLAGS=-fprofile-instr-generate'
          cmake --build build/coverage-library --parallel
          cmake --install build/coverage-library \
            --prefix "$RUNNER_TEMP/opendoors"

      - name: Build installed acceptance consumer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake \
            -S tests/acceptance \
            -B build/coverage-acceptance \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/opendoors" \
            -DOPENDOORS_VARIANT=Shared \
            -DOPENDOORS_ACCEPTANCE_EXTENDED=ON \
            '-DCMAKE_C_FLAGS=-fprofile-instr-generate -fcoverage-mapping' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate'
          cmake --build build/coverage-acceptance --parallel

      - name: Run and report acceptance coverage
        run: |
          mkdir -p build/coverage-profiles build/acceptance-coverage-html
          LLVM_PROFILE_FILE="$PWD/build/coverage-profiles/%p-%m.profraw" \
            ctest \
              --test-dir build/coverage-acceptance \
              --output-on-failure \
              --output-junit acceptance-coverage.xml
          llvm-profdata merge -sparse build/coverage-profiles/*.profraw \
            -o build/acceptance.profdata
          library=$(find "$RUNNER_TEMP/opendoors" -type f \
            -name 'libODoors.so*' | head -n 1)
          test -n "$library"
          llvm-cov report "$library" \
            -instr-profile=build/acceptance.profdata \
            -ignore-filename-regex='/(tests|third_party)/' \
            > build/acceptance-coverage.txt
          llvm-cov show "$library" \
            -instr-profile=build/acceptance.profdata \
            -ignore-filename-regex='/(tests|third_party)/' \
            -format=html \
            -output-dir=build/acceptance-coverage-html
          cat build/acceptance-coverage.txt
          {
            echo '## Public acceptance branch coverage'
            echo
            echo '```text'
            tail -n 2 build/acceptance-coverage.txt
            echo '```'
            echo
            echo 'Directional report only; no percentage or delta gate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-branch-coverage
          path: |
            build/acceptance-coverage.txt
            build/acceptance-coverage-html
            build/coverage-acceptance/acceptance-coverage.xml
            build/coverage-acceptance/Testing/Temporary/LastTest.log
