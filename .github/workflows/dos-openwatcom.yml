name: DOS Open Watcom experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: Verify Linux-hosted DOS toolchain
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Open Watcom
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0'
          tag: 2026-08-01-Build
          target: dos

      - name: Verify DOS tools and target
        run: |
          set -x
          command -v wcc
          command -v wcl
          command -v wasm
          command -v wlib
          command -v wlink
          command -v wmake

          printf '%s\n' \
            '#include <stdio.h>' \
            'int main(void) { puts("Open Watcom DOS toolchain works"); return 0; }' \
            > "$RUNNER_TEMP/hello.c"

          wcl -bt=dos -ml \
            -fe="$RUNNER_TEMP/hello.exe" \
            "$RUNNER_TEMP/hello.c"

          test -s "$RUNNER_TEMP/hello.exe"
          test "$(od -An -tx1 -N2 "$RUNNER_TEMP/hello.exe" | tr -d ' ')" = '4d5a'
          file "$RUNNER_TEMP/hello.exe"
