name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: >-
          .\build-msvc.ps1
          -Architecture '${{ matrix.architecture }}'
          -Configuration '${{ matrix.configuration }}'
          -WarningsAsErrors

      - name: Test
        shell: pwsh
        run: >-
          ctest
          --test-dir 'build/msvc/${{ matrix.architecture }}'
          -C '${{ matrix.configuration }}'
          --output-on-failure

      - name: Inspect DLL architecture and exports
        shell: pwsh
        run: |
          $architecture = '${{ matrix.architecture }}'
          $configuration = '${{ matrix.configuration }}'
          $buildDirectory = Join-Path $PWD "build\msvc\$architecture"
          $dll = Join-Path $buildDirectory "bin\$configuration\ODoors62.dll"
          $libraryDirectory = Join-Path $buildDirectory "lib\$configuration"

          foreach ($path in @(
              $dll,
              (Join-Path $libraryDirectory 'ODoorW.lib'),
              (Join-Path $libraryDirectory 'ODoors-static.lib'))) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected build output was not found: $path"
              }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
              'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          if (-not $installation) {
              throw 'A Visual Studio C++ installation was not found.'
          }

          $targetDirectory = if ($architecture -eq 'x86') {
              'Hostx64\x86'
          } else {
              'Hostx64\x64'
          }
          $dumpbin = Get-ChildItem -Path (Join-Path $installation `
              "VC\Tools\MSVC\*\bin\$targetDirectory\dumpbin.exe") |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          if (-not $dumpbin) {
              throw 'dumpbin.exe was not found.'
          }

          $headers = & $dumpbin.FullName /headers $dll 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
              throw 'dumpbin /headers failed.'
          }
          $machinePattern = if ($architecture -eq 'x86') {
              '14C machine \(x86\)'
          } else {
              '8664 machine \(x64\)'
          }
          if ($headers -notmatch $machinePattern) {
              throw "ODoors62.dll does not contain the expected $architecture machine header."
          }

          $exports = & $dumpbin.FullName /exports $dll 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
              throw 'dumpbin /exports failed.'
          }
          foreach ($symbol in @(
              'od_init',
              'od_printf',
              'od_control',
              'od_save_screen_size',
              'od_save_screen_ex',
              'od_restore_screen_ex')) {
              if ($exports -notmatch "\b$symbol\b") {
                  throw "ODoors62.dll does not export $symbol."
              }
          }

  unix:
    name: ${{ matrix.os }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DOPENDOORS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  package:
    name: Installed package (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Shared
            build_shared: ON
            build_static: OFF
          - variant: Static
            build_shared: OFF
            build_static: ON

    steps:
      - uses: actions/checkout@v7

      - name: Configure selected library variant
        run: >-
          cmake
          -S .
          -B build/package
          -DCMAKE_BUILD_TYPE=Release
          -DOPENDOORS_BUILD_SHARED=${{ matrix.build_shared }}
          -DOPENDOORS_BUILD_STATIC=${{ matrix.build_static }}
          -DOPENDOORS_BUILD_EXAMPLES=OFF
          -DOPENDOORS_WARNINGS_AS_ERRORS=ON

      - name: Build and test selected variant
        run: |
          cmake --build build/package --parallel
          ctest --test-dir build/package --output-on-failure

      - name: Install OpenDoors package
        run: >-
          cmake
          --install build/package
          --prefix '${{ runner.temp }}/opendoors-install'

      - name: Verify installed public headers
        run: |
          diff -u \
            <(printf '%s\n' ODStat.h OpenDoor.h) \
            <(find '${{ runner.temp }}/opendoors-install/include' \
              -maxdepth 1 -type f -printf '%f\n' | sort)

      - name: Build installed-package consumer
        run: |
          cmake \
            -S tests/package_consumer \
            -B build/consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH='${{ runner.temp }}/opendoors-install' \
            -DOPENDOORS_VARIANT=${{ matrix.variant }}
          cmake --build build/consumer --parallel
          ctest --test-dir build/consumer --output-on-failure

  package-windows:
    name: Installed package (Windows ${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Shared
            build_shared: ON
            build_static: OFF
          - variant: Static
            build_shared: OFF
            build_static: ON

    steps:
      - uses: actions/checkout@v7

      - name: Configure selected library variant
        shell: pwsh
        run: >-
          cmake
          -S .
          -B build/package
          -A x64
          -DOPENDOORS_BUILD_SHARED=${{ matrix.build_shared }}
          -DOPENDOORS_BUILD_STATIC=${{ matrix.build_static }}
          -DOPENDOORS_BUILD_EXAMPLES=OFF
          -DOPENDOORS_WARNINGS_AS_ERRORS=ON

      - name: Build and test selected variant
        shell: pwsh
        run: |
          cmake --build build/package --config Release --parallel
          ctest --test-dir build/package -C Release --output-on-failure

      - name: Install OpenDoors package
        shell: pwsh
        run: >-
          cmake
          --install build/package
          --config Release
          --prefix "$env:RUNNER_TEMP/opendoors-install"

      - name: Verify installed public headers
        shell: pwsh
        run: |
          $headers = Get-ChildItem -File `
            "$env:RUNNER_TEMP/opendoors-install/include" |
            Sort-Object Name |
            ForEach-Object Name
          $expected = @('ODStat.h', 'OpenDoor.h')
          if (Compare-Object $expected $headers) {
              throw "Unexpected installed headers: $($headers -join ', ')"
          }

      - name: Build installed-package consumer
        shell: pwsh
        run: |
          cmake `
            -S tests/package_consumer `
            -B build/consumer `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/opendoors-install" `
            -DOPENDOORS_VARIANT=${{ matrix.variant }}
          cmake --build build/consumer --config Release --parallel
          $env:PATH = "$env:RUNNER_TEMP\opendoors-install\bin;$env:PATH"
          ctest --test-dir build/consumer -C Release --output-on-failure

  dos:
    name: DOS Open Watcom 16-bit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Restore Open Watcom cache
        id: watcom-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/watcom
          key: open-watcom-${{ runner.os }}-${{ runner.arch }}-2.0-2026-08-01

      - name: Set up Open Watcom
        if: steps.watcom-cache.outputs.cache-hit != 'true'
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0'
          tag: 2026-08-01-Build
          target: dos
          environment: false

      - name: Save Open Watcom cache
        if: >-
          steps.watcom-cache.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v6
        with:
          path: ~/watcom
          key: open-watcom-${{ runner.os }}-${{ runner.arch }}-2.0-2026-08-01

      - name: Configure Open Watcom environment
        run: |
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl" >> "$GITHUB_PATH"

      - name: Verify DOS tools and target
        run: |
          set -x
          command -v wcc
          command -v wcl
          command -v wasm
          command -v wlib
          command -v wlink
          command -v wmake

          printf '%s\n' \
            '#include <stdio.h>' \
            'int main(void) { puts("Open Watcom DOS toolchain works"); return 0; }' \
            > "$RUNNER_TEMP/hello.c"

          wcl -bt=dos -ml \
            -fe="$RUNNER_TEMP/hello.exe" \
            "$RUNNER_TEMP/hello.c"

          test -s "$RUNNER_TEMP/hello.exe"
          test "$(od -An -tx1 -N2 "$RUNNER_TEMP/hello.exe" | tr -d ' ')" = '4d5a'
          file "$RUNNER_TEMP/hello.exe"

      - name: Configure OpenDoors DOS build
        env:
          CC: wcl
        run: >-
          cmake
          -S dos
          -B build/dos
          -G 'Watcom WMake'
          -D CMAKE_SYSTEM_NAME=DOS
          -D CMAKE_SYSTEM_PROCESSOR=I86
          -D CMAKE_BUILD_TYPE=Release
          -D OPENDOORS_WARNINGS_AS_ERRORS=ON

      - name: Build OpenDoors DOS library and tests
        run: cmake --build build/dos

      - name: Verify OpenDoors DOS outputs
        run: |
          test -s build/dos/ODoorl.lib
          test -s build/dos/dos_link_smoke.exe
          test -s build/dos/odtest.exe
          test -s build/dos/odpers.exe
          test "$(od -An -tx1 -N2 build/dos/dos_link_smoke.exe | tr -d ' ')" = '4d5a'
          test "$(od -An -tx1 -N2 build/dos/odtest.exe | tr -d ' ')" = '4d5a'
          test "$(od -An -tx1 -N2 build/dos/odpers.exe | tr -d ' ')" = '4d5a'
          file build/dos/ODoorl.lib build/dos/dos_link_smoke.exe \
            build/dos/odtest.exe build/dos/odpers.exe

      - name: Install DOSBox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes dosbox xvfb xauth

      - name: Run bounded DOS runtime tests
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          rm -f build/dos/DOSPASS.OK
          rm -f build/dos/DOSFAIL.TXT
          rm -f build/dos/PERSPASS.OK
          rm -f build/dos/PERSFAIL.TXT
          timeout --signal=TERM --kill-after=5s 30s \
            xvfb-run -a dosbox -noconsole \
              -c "mount c $PWD/build/dos" \
              -c 'c:' \
              -c 'odtest.exe' \
              -c 'odpers.exe' \
              -c 'exit' \
            2>&1 | tee build/dos/dosbox.log
          if ! test -s build/dos/DOSPASS.OK; then
            cat build/dos/DOSFAIL.TXT || true
            exit 1
          fi
          if ! test -s build/dos/PERSPASS.OK; then
            cat build/dos/PERSFAIL.TXT || true
            exit 1
          fi

      - name: Upload OpenDoors DOS outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opendoors-dos-openwatcom
          path: |
            build/dos/ODoorl.lib
            build/dos/dos_link_smoke.exe
            build/dos/odtest.exe
            build/dos/odpers.exe
            build/dos/DOSPASS.OK
            build/dos/DOSFAIL.TXT
            build/dos/PERSPASS.OK
            build/dos/PERSFAIL.TXT
            build/dos/dosbox.log
